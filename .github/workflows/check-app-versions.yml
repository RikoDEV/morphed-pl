name: Check app versions

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be opened
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare with Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install google-play-scraper
        run: python -m pip install google-play-scraper

      - name: Check versions and open issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python .github/scripts/check_app_versions.py
