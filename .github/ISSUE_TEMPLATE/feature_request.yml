name: ⭐ Feature request / Propozycja funkcji
description: Create a detailed request for a new feature. / Zaproponuj nową funkcję.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        # Morphed PL feature request / Propozycja funkcji

        You can write in English or in Polish. / Możesz pisać po polsku lub po angielsku.

        - **Do not submit a duplicate feature request**: Search for existing feature requests [here](https://github.com/RikoDEV/morphed-pl/issues?q=label%3A%22Feature+request%22).
          / **Nie zgłaszaj duplikatów**: sprawdź istniejące propozycje [tutaj](https://github.com/RikoDEV/morphed-pl/issues?q=label%3A%22Feature+request%22).
        - **Review the contribution guidelines**: You can find them [here](https://github.com/RikoDEV/morphed-pl#-adding-another-app).
          / **Zapoznaj się z zasadami współtworzenia**: znajdziesz je [tutaj](https://github.com/RikoDEV/morphed-pl#-adding-another-app).
  - type: textarea
    attributes:
      label: Feature description / Opis funkcji
      description: |
        - Describe your feature in detail / Opisz funkcję dokładnie
        - Add images, videos, links, examples, references, etc. if possible / Dodaj zrzuty ekranu, nagrania, linki, przykłady
  - type: textarea
    attributes:
      label: Motivation / Uzasadnienie
      description: |
        A strong motivation is necessary for a feature request to be considered. / Propozycja musi mieć mocne uzasadnienie.

        - Why should this feature be implemented? / Dlaczego ta funkcja jest potrzebna?
        - What is the explicit use case? / Jaki jest konkretny przypadek użycia?
        - What are the benefits? / Jakie są korzyści?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements / Potwierdzenia
      description: Your feature request will be closed if you don't follow the checklist below. / Propozycja zostanie zamknięta, jeśli nie spełnisz poniższej listy.
      options:
        - label: I have checked all open and closed feature requests and this is not a duplicate. / Sprawdziłem otwarte i zamknięte propozycje, to nie jest duplikat.
          required: true
        - label: I have chosen an appropriate title. / Wybrałem odpowiedni tytuł.
          required: true
        - label: All requested information has been provided properly. / Podałem wszystkie wymagane informacje.
          required: true
